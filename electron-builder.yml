appId: ai.9router.desktop
productName: 9Router
directories:
  output: dist-electron
  buildResources: electron
files:
  - electron/**/*
  - package.json
  # The gateway runtime ships as extraResources (desktop-app -> resources/app);
  # packing the project's own node_modules into the asar would double its size.
  - "!node_modules/**/*"
extraResources:
  - from: desktop-app
    to: app
asar: true
npmRebuild: false
buildDependenciesFromSource: false
win:
  target:
    - target: portable
      arch:
        - x64
  # Cross-building on Linux: skip wine/rcedit (no icon/version resources embedded).
  signAndEditExecutable: false
portable:
  artifactName: 9Router-${version}-portable.exe
