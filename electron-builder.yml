appId: ai.9router.desktop
productName: 9Router
directories:
  output: dist-electron
  buildResources: electron
files:
  - electron/**/*
  - package.json
  # The gateway runtime ships as extraResources (desktop-app -> resources/app);
  # packing the project's own node_modules into the asar would double its size.
  - "!node_modules/**/*"
extraResources:
  - from: desktop-app
    to: app
asar: true
npmRebuild: false
buildDependenciesFromSource: false
linux:
  icon: electron/icon.png
  category: Network
  target:
    - target: AppImage
      arch:
        - x64
  artifactName: 9Router-${version}-${arch}.AppImage
win:
  icon: electron/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  # Cross-building on Linux: skip wine/rcedit (no icon/version resources embedded).
  # Building on Windows overrides this to true, so the exe carries icon + metadata.
  signAndEditExecutable: false
nsis:
  include: electron/installer.nsh
  # Per-user install in %LOCALAPPDATA%\Programs: no admin prompt, no UAC.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 9Router
  # %APPDATA%\9router holds the gateway database (connections, keys); an
  # uninstall must not take the user's data with it.
  deleteAppDataOnUninstall: false
  artifactName: 9Router-${version}-setup.exe
portable:
  artifactName: 9Router-${version}-portable.exe
